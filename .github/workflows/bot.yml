name: FireHire Discord Bot 24/7

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات — يكمّل الـ job اللي قبلها
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 ساعات كحد أقصى لـ GitHub Actions
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: last_state.json
          key: firehire-state-v1
          restore-keys: firehire-state-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot (5.5-hour window)
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BOT_MAX_RUNTIME_MINUTES: '330'
        run: python bot.py

      - name: Save state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_state.json
          key: firehire-state-v1
