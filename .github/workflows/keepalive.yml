name: Keep Alive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep alive ping
        run: |
          git config user.name "FireHire Bot"
          git config user.email "bot@firehire.com"
          echo "$(date)" > .keepalive
          git add .keepalive
          git commit -m "chore: keep alive [skip ci]"
          git push
