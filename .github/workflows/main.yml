name: FireHire Discord Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check 1
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Wait 60 seconds
        run: sleep 60

      - name: Run check 2
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Wait 60 seconds
        run: sleep 60

      - name: Run check 3
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Wait 60 seconds
        run: sleep 60

      - name: Run check 4
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Wait 60 seconds
        run: sleep 60

      - name: Run check 5
        env:
          DISCORD_TOKEN:      ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python bot.py

      - name: Save state to repo
        run: |
          git config user.name  "FireHire Bot"
          git config user.email "bot@firehire.com"
          git add last_state.json || true
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push || true
